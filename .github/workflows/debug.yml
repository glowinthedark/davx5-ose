name: Create debug APK
on:
  # push:
  #   tags:
  #     - v*
  workflow_dispatch: 

concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true

env:
  prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}

jobs:
  build:
    name: Create debug apk
    permissions:
      contents: write
      discussions: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5

      # - name: Prepare keystore
      #   run: echo ${{ secrets.android_keystore_base64 }} | base64 -d >$GITHUB_WORKSPACE/keystore.jks

      - name: Build signed package
        # Use build cache to speed up building of build variants, but clean caches from previous tests before
        run: ./gradlew --build-cache --configuration-cache --no-daemon app:clean app:assembleDebug
        # env:
        #   ANDROID_KEYSTORE: ${{ github.workspace }}/keystore.jks
        #   ANDROID_KEYSTORE_PASSWORD: ${{ secrets.android_keystore_password }}
        #   ANDROID_KEY_ALIAS: ${{ secrets.android_key_alias }}
          # ANDROID_KEY_PASSWORD: ${{ secrets.android_key_password }}
          
      - name: Upload APK artifacts - ${{ env.repository_name }}
        if: false
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-debug.apk
          path: app/build/outputs/apk/ose/debug/*.apk
          
      - name: Set env vars
        run: |
          echo "TAG=$(git describe --tags --abbrev=1 || echo ${{ github.event.repository.name }})" >> $GITHUB_ENV
          
      - name: Create Github release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          prerelease: ${{ env.prerelease }}
          files: app/build/outputs/apk/ose/debug/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
